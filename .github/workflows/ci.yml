name: CI

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: macos-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5.1.0
      - uses: oven-sh/setup-bun@v2.2.0
      - name: The comment ban (tools/no-comments)
        run: bin/no-comments
      - name: Lockfile check (every action pinned to a commit)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh extension list | grep -q 'gh-actions-lock' || gh extension install github/gh-actions-lock --pin v0.4.1
          gh actions-lock --verify
      - run: brew install starship luajit
      - run: for t in tests/*-test.sh; do echo "== $t"; bash "$t" || exit 1; done

  docs:
    runs-on: macos-latest
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5.1.0
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - run: npm ci
        working-directory: docs-site
      - run: npm run check-content
        working-directory: docs-site
      - run: npm run build
        working-directory: docs-site
