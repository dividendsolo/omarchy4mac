name: CI

# CI runs once per PR, right before the merge, and the merge waits for it. It
# starts by hand (workflow_dispatch) on the PR branch, and the merge happens
# only when it passes. Pushes do not run it, to save Actions minutes.
on:
  workflow_dispatch:

jobs:
  check:
    # A GitHub macOS runner: this is a Mac desktop, and its scripts use the Mac's own tools (BSD date). The Jog
    # runners take private repos only, and this repo is public.
    runs-on: macos-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      # tests/starship-test.sh renders the prompt with the real starship;
      # tests/menu-test.sh loads hammerspoon/init.lua in luajit.
      - run: brew install starship luajit
      - run: for t in tests/*-test.sh; do echo "== $t"; bash "$t" || exit 1; done
