start-at-login = false

after-startup-command = ['exec-and-forget $HOME/.local/bin/omarchy-workspace-layout restore']

config-version = 2
persistent-workspaces = ['1', '2', '3', '4', '5']

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

on-focused-monitor-changed = [
  'move-mouse monitor-lazy-center',
  'exec-and-forget /bin/bash -c "/opt/homebrew/bin/sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE=$(/opt/homebrew/bin/aerospace list-workspaces --focused)"'
]
on-focus-changed = ['move-mouse window-lazy-center']

exec-on-workspace-change = ['/bin/bash', '-c',
  '/opt/homebrew/bin/sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE']

[workspace-to-monitor-force-assignment]
1 = ['\(1\)$', '\(2\)$', 'VA2446', 'built-in']
2 = ['\(2\)$', '\(1\)$', 'VA2446', 'built-in']
3 = ['\(2\)$', '\(1\)$', 'VA2446', 'built-in']
4 = ['built-in', '\(2\)$', '\(1\)$', 'VA2446']
5 = ['built-in', '\(2\)$', '\(1\)$', 'VA2446']

[gaps]
inner.horizontal = 8
inner.vertical = 8
outer.left = 8
outer.bottom = 8
outer.top = 40
outer.right = 8

[mode.main.binding]

cmd-space = 'exec-and-forget open -a Raycast'
cmd-ctrl-l = '''exec-and-forget osascript -e 'tell application "System Events" to keystroke "q" using {control down, command down}' '''

alt-w = '''exec-and-forget osascript -e 'tell application "System Events" to keystroke "q" using {command down}' '''
alt-q = '''exec-and-forget osascript -e 'tell application "System Events" to keystroke "q" using {command down}' '''
ctrl-alt-backspace = 'close-all-windows-but-current'

alt-s = 'layout floating tiling'
alt-t = 'exec-and-forget $HOME/.local/bin/theme random'
alt-j = 'layout tiles horizontal vertical'
alt-a = 'layout accordion tiles'
alt-l = 'exec-and-forget $HOME/.local/bin/omarchy-workspace-layout cycle'
cmd-alt-l = 'exec-and-forget $HOME/.local/bin/omarchy-workspace-layout back'
alt-m = 'macos-native-minimize'

alt-f = 'fullscreen'
cmd-alt-f = 'fullscreen'
cmd-ctrl-f = 'fullscreen'

alt-1 = 'exec-and-forget $HOME/.local/bin/omarchy-workspace 1'
alt-2 = 'exec-and-forget $HOME/.local/bin/omarchy-workspace 2'
alt-3 = 'exec-and-forget $HOME/.local/bin/omarchy-workspace 3'
alt-4 = 'exec-and-forget $HOME/.local/bin/omarchy-workspace 4'
alt-5 = 'exec-and-forget $HOME/.local/bin/omarchy-workspace 5'

alt-tab = 'workspace --wrap-around next'
cmd-ctrl-tab = 'workspace-back-and-forth'

cmd-shift-1 = 'exec-and-forget $HOME/.local/bin/omarchy-workspace --move-follow 1'
cmd-shift-2 = 'exec-and-forget $HOME/.local/bin/omarchy-workspace --move-follow 2'
cmd-shift-3 = 'exec-and-forget $HOME/.local/bin/omarchy-workspace --move-follow 3'
cmd-shift-4 = 'exec-and-forget $HOME/.local/bin/omarchy-workspace --move-follow 4'
cmd-shift-5 = 'exec-and-forget $HOME/.local/bin/omarchy-workspace --move-follow 5'

cmd-shift-alt-1 = 'exec-and-forget $HOME/.local/bin/omarchy-workspace --move 1'
cmd-shift-alt-2 = 'exec-and-forget $HOME/.local/bin/omarchy-workspace --move 2'
cmd-shift-alt-3 = 'exec-and-forget $HOME/.local/bin/omarchy-workspace --move 3'
cmd-shift-alt-4 = 'exec-and-forget $HOME/.local/bin/omarchy-workspace --move 4'
cmd-shift-alt-5 = 'exec-and-forget $HOME/.local/bin/omarchy-workspace --move 5'

cmd-left = 'focus --boundaries all-monitors-outer-frame left'
cmd-down = 'focus --boundaries all-monitors-outer-frame down'
cmd-up = 'focus --boundaries all-monitors-outer-frame up'
cmd-right = 'focus --boundaries all-monitors-outer-frame right'

cmd-shift-left = 'move left'
cmd-shift-down = 'move down'
cmd-shift-up = 'move up'
cmd-shift-right = 'move right'

cmd-shift-alt-left = 'move-workspace-to-monitor --wrap-around prev'
cmd-shift-alt-right = 'move-workspace-to-monitor --wrap-around next'
cmd-shift-alt-up = 'move-workspace-to-monitor --wrap-around prev'
cmd-shift-alt-down = 'move-workspace-to-monitor --wrap-around next'

cmd-ctrl-shift-left = 'exec-and-forget $HOME/.local/bin/omarchy-move-to-monitor left'
cmd-ctrl-shift-right = 'exec-and-forget $HOME/.local/bin/omarchy-move-to-monitor right'
cmd-ctrl-shift-up = 'exec-and-forget $HOME/.local/bin/omarchy-move-to-monitor up'
cmd-ctrl-shift-down = 'exec-and-forget $HOME/.local/bin/omarchy-move-to-monitor down'

alt-equal = 'resize smart +50'
alt-minus = 'resize smart -50'
cmd-shift-equal = 'resize height +50'
cmd-shift-minus = 'resize height -50'

ctrl-alt-tab = 'focus-monitor --wrap-around next'
ctrl-alt-shift-tab = 'focus-monitor --wrap-around prev'

cmd-alt-backtick = 'focus --boundaries-action wrap-around-the-workspace dfs-next'
cmd-alt-shift-backtick = 'focus --boundaries-action wrap-around-the-workspace dfs-prev'

alt-enter = 'exec-and-forget $HOME/.local/bin/omarchy-terminal'
cmd-alt-enter = 'exec-and-forget open -na Ghostty --args -e /bin/zsh -lc "tmux attach -t Work || tmux new -s Work"'
cmd-ctrl-enter = 'exec-and-forget open -na Ghostty --args -e herdr'
cmd-shift-enter = 'exec-and-forget $HOME/.local/bin/omarchy-launch-browser'
cmd-shift-alt-b = 'exec-and-forget $HOME/.local/bin/omarchy-launch-browser --private'
cmd-alt-c = 'exec-and-forget open -a "Google Chrome"'

cmd-shift-f = 'exec-and-forget open -a Finder'
cmd-shift-alt-f = 'exec-and-forget open -a Finder'

cmd-shift-m = 'exec-and-forget open -a Spotify'
cmd-shift-q = 'exec-and-forget open -a Calculator'
cmd-shift-slash = 'exec-and-forget open -a 1Password'
cmd-shift-n = 'exec-and-forget open -na Ghostty --args -e nvim'

cmd-shift-c = 'exec-and-forget $HOME/.local/bin/omarchy-launch-browser --app=https://app.hey.com/calendar --workspace=4'
cmd-shift-e = 'exec-and-forget $HOME/.local/bin/omarchy-launch-browser --app=https://app.hey.com --workspace=4'

cmd-shift-a = 'exec-and-forget open -a Claude'
cmd-shift-alt-a = 'exec-and-forget $HOME/.local/bin/omarchy-launch-browser --app=https://grok.com --workspace=3'

cmd-shift-g = 'exec-and-forget open -a Signal'
cmd-shift-alt-g = 'exec-and-forget open -a WhatsApp'
cmd-shift-ctrl-g = 'exec-and-forget $HOME/.local/bin/omarchy-launch-browser --app=https://chat.google.com --workspace=4'

cmd-shift-p = 'exec-and-forget $HOME/.local/bin/omarchy-launch-browser --app=https://photos.google.com --workspace=5'
cmd-shift-d = 'exec-and-forget open -na Ghostty --args -e lazydocker'
cmd-shift-o = 'exec-and-forget open -a Obsidian'
cmd-shift-w = 'exec-and-forget open -a Typora'

cmd-shift-x = 'exec-and-forget open https://x.com'
cmd-shift-alt-x = 'exec-and-forget open https://x.com/compose/post'
cmd-shift-y = 'exec-and-forget $HOME/.local/bin/omarchy-launch-browser --app=https://youtube.com --workspace=5'

cmd-ctrl-c = 'exec-and-forget /bin/sh -c "osascript -e \"tell application \\\"System Events\\\" to key code 23 using {command down, shift down}\""'
cmd-ctrl-alt-c = '''exec-and-forget osascript -e 'tell application "System Events" to key code 21 using {command down, shift down}' '''

cmd-ctrl-i = 'exec-and-forget /bin/sh -c "pgrep -x caffeinate >/dev/null && pkill -x caffeinate || caffeinate -dimsu &"'

cmd-ctrl-alt-comma = 'exec-and-forget shortcuts run "Toggle Do Not Disturb"'

cmd-ctrl-a = 'exec-and-forget open "x-apple.systempreferences:com.apple.Sound-Settings.extension"'
cmd-ctrl-b = 'exec-and-forget open "x-apple.systempreferences:com.apple.BluetoothSettings"'
cmd-ctrl-n = 'exec-and-forget open "x-apple.systempreferences:com.apple.wifi-settings-extension"'
cmd-ctrl-s = 'exec-and-forget open -a LocalSend'
alt-shift-t = 'exec-and-forget open -na Ghostty --args -e btop'
cmd-ctrl-h = 'exec-and-forget open -a "System Information"'
cmd-ctrl-period = 'exec-and-forget open -a HandBrake'

cmd-ctrl-e = 'exec-and-forget open "raycast://extensions/raycast/emoji-symbols/search-emoji-symbols"'
cmd-ctrl-alt-e = 'exec-and-forget open -a Clock'
cmd-ctrl-alt-f = 'exec-and-forget /opt/homebrew/bin/sketchybar --bar hidden=toggle'
cmd-shift-ctrl-a = 'exec-and-forget open -na Ghostty --args -e $HOME/.local/bin/omarchy-agent'
cmd-ctrl-z = '''exec-and-forget osascript -e 'tell application "System Events" to key code 28 using {option down, command down}' '''

cmd-esc = 'exec-and-forget /opt/homebrew/bin/hs -c "omarchyMenu(\"System\")"'
cmd-ctrl-v = 'exec-and-forget open "raycast://extensions/raycast/clipboard-history/clipboard-history"'

cmd-shift-semicolon = 'mode service'

[mode.service.binding]
esc = ['reload-config', 'mode main']
r = ['flatten-workspace-tree', 'mode main']
f = ['layout floating tiling', 'mode main']
backspace = ['close-all-windows-but-current', 'mode main']
cmd-shift-left = ['join-with left', 'mode main']
cmd-shift-down = ['join-with down', 'mode main']
cmd-shift-up = ['join-with up', 'mode main']
cmd-shift-right = ['join-with right', 'mode main']

