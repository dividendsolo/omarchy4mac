server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  location = /up {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location = /api/search {
    default_type application/json;
    try_files /api/search =404;
  }

  location / {
    try_files $uri $uri.html $uri/index.html =404;
  }

  error_page 404 /404.html;
}
